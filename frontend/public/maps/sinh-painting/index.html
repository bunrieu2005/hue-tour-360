<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bản Đồ 3D Làng Sình – Tranh Dân Gian & Hội Vật Huế</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fbf4e2;
      --cream-dark: #efe2c2;
      --gold: #f3dc9a;
      --gold-deep: #d49b27;
      --brown: #4a2e1b;
      --brown-soft: #785236;
      --olive: #7a8f4b;
      --river: #2f6f8f;
      --shadow: 0 10px 28px rgba(42, 26, 12, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #app {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Be Vietnam Pro', 'Nunito', sans-serif;
      background: #232c1d; color: var(--brown);
    }

    /* Loading screen */
    #loading-screen {
      position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(155deg, #2d4329 0%, #4b5d2e 55%, #8c6b36 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--cream); transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-title { font-family: 'Nunito', sans-serif; font-size: clamp(1.5rem, 4vw, 2.3rem); font-weight: 800; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.35); }
    .loader-sub { font-size: 0.92rem; opacity: 0.9; margin-bottom: 22px; }
    .progress-wrap { width: min(340px, 80vw); height: 12px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; border: 2px solid var(--gold); }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), #ffae34); transition: width 0.25s ease; }
    .progress-text { margin-top: 10px; font-size: 0.85rem; font-weight: 600; color: var(--gold); }

    /* Labels CSS2D */
    .lm-label {
      background: var(--cream);
      color: #5c3712;
      border: 2px solid #fff7df;
      box-shadow: 0 0 0 2px var(--gold-deep), 0 6px 14px rgba(0,0,0,0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.15s ease, opacity 0.25s ease;
      pointer-events: auto;
      user-select: none;
    }
    .lm-label:hover { transform: translate(-50%, -108%) scale(1.05); }
    .lm-label.lod-hidden { opacity: 0; pointer-events: none; }

    .road-label {
      color: #4f5249;
      font-size: 10px;
      font-weight: 700;
      text-shadow: -1px -1px 0 rgba(251,244,226,0.9), 1px -1px 0 rgba(251,244,226,0.9), -1px 1px 0 rgba(251,244,226,0.9), 1px 1px 0 rgba(251,244,226,0.9);
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.25s ease;
    }
    .road-label.lod-hidden { opacity: 0; }

    .hotspot-bubble {
      width: 34px; height: 38px;
      background: var(--gold);
      border: 3px solid var(--gold-deep);
      border-radius: 50% 50% 50% 18%;
      transform: translate(-50%, -115%) rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 14px rgba(42, 26, 12, 0.35);
      cursor: pointer;
      pointer-events: auto;
      animation: bobbing 2.2s ease-in-out infinite;
    }
    .hotspot-bubble span {
      transform: rotate(45deg);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: var(--brown);
    }
    .hotspot-bubble.solved {
      background: #8fd175;
      border-color: #3d8b28;
    }
    @keyframes bobbing {
      0%, 100% { transform: translate(-50%, -115%) rotate(-45deg); }
      50% { transform: translate(-50%, -132%) rotate(-45deg); }
    }

    /* HUD */
    .hud-top {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .hud-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: auto; }

    .btn-hud {
      background: var(--cream); color: var(--brown);
      border: 2px solid var(--gold-deep); border-radius: 14px;
      padding: 8px 12px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; box-shadow: var(--shadow);
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-hud:hover { background: var(--cream-dark); transform: translateY(-1px); }
    .btn-hud.active { background: var(--gold); box-shadow: inset 0 2px 4px rgba(0,0,0,0.12); }

    .search-box {
      position: relative; display: flex; align-items: center;
    }
    .search-input {
      background: var(--cream); color: var(--brown);
      border: 2px solid var(--gold-deep); border-radius: 14px;
      padding: 8px 12px; font-size: 12.5px; width: 195px;
      outline: none; box-shadow: var(--shadow);
    }
    .search-results {
      position: absolute; top: 42px; left: 0; right: 0;
      background: var(--cream); border: 2px solid var(--gold-deep);
      border-radius: 12px; box-shadow: var(--shadow); display: none; overflow: hidden;
    }
    .search-results.open { display: block; }
    .search-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--cream-dark); }
    .search-item:hover { background: var(--gold); }

    /* Pill boat button */
    #boat-pill {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 25;
      background: linear-gradient(180deg, #ffe58f, var(--gold));
      color: var(--brown); border: 2.5px solid var(--gold-deep);
      border-radius: 999px; padding: 10px 18px;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13.5px;
      box-shadow: 0 8px 22px rgba(31, 78, 102, 0.4);
      cursor: pointer; display: none; align-items: center; gap: 8px;
    }
    #boat-pill.visible { display: inline-flex; }

    /* Mini-map */
    #minimap {
      position: fixed; bottom: 16px; right: 16px; z-index: 20;
      width: 124px; height: 124px; border-radius: 18px;
      background: rgba(122, 143, 75, 0.9);
      border: 3px solid var(--cream); box-shadow: var(--shadow);
      overflow: hidden; cursor: pointer;
    }
    #minimap canvas { width: 100%; height: 100%; display: block; }

    /* Cards counter */
    #cards-badge {
      position: fixed; bottom: 16px; left: 16px; z-index: 20;
      background: var(--cream); border: 2px solid var(--gold-deep);
      border-radius: 14px; padding: 8px 12px; font-size: 12px; font-weight: 700;
      box-shadow: var(--shadow); cursor: pointer;
    }

    /* Quiz & Mini-game Modal */
    #modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(24, 18, 10, 0.55); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #modal-backdrop.open { display: flex; }
    .modal-card {
      width: min(540px, 100%); max-height: 88vh; overflow-y: auto;
      background: var(--cream); border: 3px solid var(--gold-deep);
      border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .modal-tag { display: inline-block; background: var(--gold); padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
    .modal-title { font-family: 'Nunito', sans-serif; font-size: 1.25rem; font-weight: 800; color: var(--brown); }
    .btn-close { background: var(--cream-dark); border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: 800; cursor: pointer; color: var(--brown); }
    .modal-story { font-size: 0.92rem; line-height: 1.58; color: var(--brown-soft); margin-bottom: 14px; }

    .quiz-q { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .quiz-opt {
      text-align: left; background: #fffdf7; border: 2px solid #dec99a;
      border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; color: var(--brown); transition: all 0.14s ease;
    }
    .quiz-opt:hover { border-color: var(--gold-deep); background: #fff5d6; }
    .quiz-opt.correct { background: #c8f2ba; border-color: #3d8b28; }
    .quiz-opt.wrong { background: #ffd1c9; border-color: #c93b2b; }

    /* Mini-games */
    .minigame-box {
      background: #fff9ea; border: 2px dashed var(--gold-deep);
      border-radius: 16px; padding: 14px; margin-top: 12px;
    }
    .minigame-title { font-weight: 800; font-size: 0.92rem; margin-bottom: 6px; }
    .print-canvas-wrap { position: relative; width: 100%; height: 170px; border-radius: 12px; overflow: hidden; background: #e8dec5; touch-action: none; }
    .print-canvas-wrap canvas { width: 100%; height: 100%; display: block; }

    .wrestle-track { position: relative; width: 100%; height: 28px; background: #e8dec5; border-radius: 999px; overflow: hidden; margin: 10px 0; border: 2px solid var(--brown-soft); }
    .wrestle-zone { position: absolute; top: 0; bottom: 0; left: 38%; width: 24%; background: rgba(61, 139, 40, 0.35); border-left: 2px solid #3d8b28; border-right: 2px solid #3d8b28; }
    .wrestle-marker { position: absolute; top: 2px; bottom: 2px; width: 14px; border-radius: 999px; background: #d93829; left: 0%; }

    .reward-card {
      margin-top: 14px; padding: 14px; border-radius: 16px;
      background: linear-gradient(135deg, #fff4cf, #f7dc94);
      border: 2px solid var(--gold-deep); display: none;
    }
    .reward-card.unlocked { display: block; }

    @media (max-width: 640px) {
      .search-input { width: 140px; }
      #minimap { width: 96px; height: 96px; }
    }
  </style>
</head>

<div id="app">
  <!-- Loading -->
  <div id="loading-screen">
    <div class="loader-title">LÀNG SÌNH 3D – LẠI ÂN, HUẾ</div>

    <div class="progress-text" id="progress-text">0%</div>

  <!-- HUD -->

    <div class="hud-group">

        <input id="search-input" class="search-input" type="text" placeholder="Tìm địa danh, đường..." autocomplete="off" />
        <div id="search-results" class="search-results"></div>

      <button class="btn-hud" id="btn-toggle-lights" title="Bật/tắt đèn">💡 Đèn</button>

      <button class="btn-hud" id="btn-daynight">🌙 Đêm</button>

      <button class="btn-hud" id="btn-reset-cam">🎯 Reset</button>
    </div>
  </div>

  <button id="boat-pill">⛵ Lên đò dọc sông Hương</button>
  <div id="cards-badge" title="Xem thẻ sưu tầm đã mở khóa">🃏 Thẻ: <span id="cards-count">0</span>/5</div>
  <div id="minimap"><canvas id="minimap-canvas" width="124" height="124"></canvas></div>

  <!-- Modal Quiz & Mini-game -->
  <div id="modal-backdrop">
    <div class="modal-card" id="modal-card"></div>
  </div>
</div>

function showMapError(error) {
  console.error('Failed to initialize the 3D village map:', error);
  const isWebGLFailure = /webgl|context/i.test(String(error));
  mapApp.dataset.mapStatus = isWebGLFailure ? 'webgl-error' : 'error';

  const loadingScreen = document.getElementById('loading-screen');
  loadingScreen.querySelector('.loader-title').textContent = isWebGLFailure
    ? 'Không thể khởi tạo bản đồ 3D'
    : 'Không thể tải bản đồ';
  loadingScreen.querySelector('.loader-sub').textContent = isWebGLFailure
    ? 'Trình duyệt hoặc môi trường hiện tại không cấp WebGL. Hãy bật tăng tốc phần cứng hoặc mở bản đồ bằng trình duyệt hỗ trợ WebGL.'
    : 'Đã xảy ra lỗi khi khởi tạo bản đồ. Vui lòng tải lại trang.';
  loadingScreen.querySelector('.progress-wrap').hidden = true;
  loadingScreen.querySelector('.progress-text').hidden = true;
}

const R_EARTH = 6378137;
const DEG2RAD = Math.PI / 180;
function toMeters(lng, lat) {
  const lat0 = CONFIG.originLat * DEG2RAD;
  const x = (lng - CONFIG.originLng) * DEG2RAD * R_EARTH * Math.cos(lat0);
  const z = -(lat - CONFIG.originLat) * DEG2RAD * R_EARTH;
  return new THREE.Vector3(x, 0, z);
}

    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uDarkness;
    uniform float uOffset;
    varying vec2 vUv;
    void main() {
      vec4 tex = texture2D(tDiffuse, vUv);
      vec2 dist = (vUv - vec2(0.5)) * uOffset;
      float vig = clamp(1.0 - dot(dist, dist) * uDarkness * 1.6, 0.0, 1.0);
      gl_FragColor = vec4(tex.rgb * vig, tex.a);
    }
  `
};

const riceUniforms = { uTime: { value: 0 } };
const waterUniforms = { uTime: { value: 0 } };
const fishCages = [];

function buildBoardAndRice() {
  const group = new THREE.Group();
  const boardGeo = new THREE.BoxGeometry(CONFIG.worldSize, 20, CONFIG.worldSize);
  const topMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.groundOlive, roughness: 0.92 });
  const sideMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.groundBorder, roughness: 0.95 });
  const board = new THREE.Mesh(boardGeo, [sideMat, sideMat, topMat, sideMat, sideMat, sideMat]);
  board.position.y = -10;
  board.receiveShadow = true;
  group.add(board);

  // Đồng lúa phía dưới phải
  const riceMat = new THREE.ShaderMaterial({
    uniforms: {
      ...riceUniforms,
      uGold: { value: new THREE.Color(CONFIG.colors.riceGold) },
      uGreen: { value: new THREE.Color(CONFIG.colors.riceGreen) }
    },
    vertexShader: `
      uniform float uTime;
      attribute float aMix;
      varying float vMix;
      varying float vWave;
      void main() {
        vMix = aMix;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        float isTop = step(0.14, position.y);
        float w = sin(wp.x * 0.065 + wp.z * 0.045 + uTime * 2.5) * 0.18 * isTop;
        wp.x += w;
        wp.y += abs(w) * 0.35;
        vWave = w;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uGold;
      uniform vec3 uGreen;
      varying float vMix;
      varying float vWave;
      void main() {
        vec3 col = mix(uGreen, uGold, vMix);
        col += vec3(0.08, 0.07, 0.02) * smoothstep(0.05, 0.18, vWave);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const bundMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.riceBund, roughness: 0.9 });

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const w = 60 + ((r * 19 + c * 29) % 22) - 11;
      const d = 54 + ((r * 13 + c * 23) % 20) - 10;
      const cx = 42 + c * 68 + (r % 2) * 7;
      const cz = 42 + r * 66;
      if (cx + cz < 185) continue;

      const paddyGeo = new THREE.BoxGeometry(w - 2.2, 0.28, d - 2.2, 5, 1, 5);
      const mixes = new Float32Array(paddyGeo.attributes.position.count).fill(((r * 7 + c * 11) % 10) / 10);
      paddyGeo.setAttribute('aMix', new THREE.BufferAttribute(mixes, 1));
      const paddy = new THREE.Mesh(paddyGeo, riceMat);
      paddy.position.set(cx, 0.14, cz);
      paddy.rotation.y = -0.14;
      group.add(paddy);

      const bund = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), bundMat);
      bund.position.set(cx, 0.1, cz);
      bund.rotation.y = -0.14;
      bund.receiveShadow = true;
      group.add(bund);
    }
  }
  scene.add(group);
}

function buildRiver() {
  const group = new THREE.Group();
  const ring = DATA.water.features[0].geometry.coordinates[0];
  const pts2 = ring.map(([lng, lat]) => {
    const v = toMeters(lng, lat);
    return new THREE.Vector2(v.x, v.z);
  });

  const shape = new THREE.Shape(pts2);
  const geom = new THREE.ShapeGeometry(shape, 20);
  geom.rotateX(Math.PI / 2);

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      ...waterUniforms,
      uShallow: { value: new THREE.Color(CONFIG.colors.waterShallow) },
      uDeep: { value: new THREE.Color(CONFIG.colors.waterDeep) }
    },
    vertexShader: `
      uniform float uTime;
      varying vec2 vXZ;
      varying float vWave;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        float wave = sin(wp.x * 0.08 + uTime * 1.6) * cos(wp.z * 0.08 + uTime * 1.2) * 0.14;
        wp.y += wave;
        vXZ = wp.xz;
        vWave = wave;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 uShallow;
      uniform vec3 uDeep;
      varying vec2 vXZ;
      varying float vWave;
      void main() {
        float depth = clamp((-vXZ.x - vXZ.y + 340.0) / 680.0, 0.0, 1.0);
        vec3 col = mix(uShallow, uDeep, depth);
        col = mix(col, vec3(0.75, 0.88, 0.94), smoothstep(0.07, 0.14, vWave) * 0.22);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  const river = new THREE.Mesh(geom, mat);
  river.position.y = -0.35;
  group.add(river);

  // Bãi cát sáng dọc bờ
  const sandMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.sandBank, roughness: 0.9, flatShading: true });
  [2, 3, 4].forEach((idx, i) => {
    const p = pts2[idx];
    if (!p) return;
    const g = new THREE.CylinderGeometry(12 + i * 2, 16 + i * 2, 0.45, 7);
    g.scale(1.5, 1, 0.6);
    const m = new THREE.Mesh(g, sandMat);
    m.position.set(p.x - 3, -0.22, p.y - 3);
    m.rotation.y = 0.7;
    group.add(m);
  });

  // Lồng bè cá nhỏ trên sông
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.8 });
  const netMat = new THREE.MeshStandardMaterial({ color: 0x264653, roughness: 0.9 });
  [[-240, -220], [-265, -195], [-135, -340]].forEach(([x, z], idx) => {
    const cage = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.55, 6.5), woodMat);
    const slot = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.6, 4.6), netMat);
    const hut = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 2.4), woodMat);
    hut.position.set(0, 1.1, -1.6);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.1, 1.1, 4), new THREE.MeshStandardMaterial({ color: CONFIG.colors.roofGray }));
    roof.position.set(0, 2.2, -1.6);
    roof.rotation.y = Math.PI / 4;
    cage.add(base, slot, hut, roof);
    cage.position.set(x, -0.2, z);
    cage.rotation.y = 0.7 + idx * 0.15;
    group.add(cage);
    fishCages.push(cage);
  });

  scene.add(group);
}

// 7. MẠNG LƯỚI ĐƯỜNG BO GÓC & ĐỒ THỊ TÌM ĐƯỜNG A*
// ============================================================================
const roadNodes = new Map();
const roadSegments = [];
const roadLabels = [];

function getOrCreateRoadNode(pos) {
  for (const n of roadNodes.values()) {
    if (n.pos.distanceTo(pos) < 4.5) return n;
  }
  const id = 'n_' + roadNodes.size;
  const node = { id, pos: pos.clone(), neighbors: [] };
  roadNodes.set(id, node);
  return node;
}

function buildRoads() {
  const surfGeoms = [];
  const edgeGeoms = [];

  for (const f of DATA.roads.features) {
    const coords = f.geometry.coordinates;
    const width = f.properties.width || 5;
    const name = f.properties.name || '';
    const pts = coords.map(([lng, lat]) => {
      const v = toMeters(lng, lat);
      return new THREE.Vector3(v.x, 0.06, v.z);
    });

    roadSegments.push({ pts, width });

    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const n1 = getOrCreateRoadNode(a);
      const n2 = getOrCreateRoadNode(b);
      if (n1.id !== n2.id) {
        const cost = n1.pos.distanceTo(n2.pos);
        if (!n1.neighbors.some(x => x.id === n2.id)) n1.neighbors.push({ id: n2.id, cost });
        if (!n2.neighbors.some(x => x.id === n1.id)) n2.neighbors.push({ id: n1.id, cost });
      }

      const dist = a.distanceTo(b);
      const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
      const angle = Math.atan2(b.x - a.x, b.z - a.z);

      const s = new THREE.BoxGeometry(width, 0.08, dist);
      s.rotateY(angle); s.translate(mid.x, 0.05, mid.z);
      surfGeoms.push(s);

      const e = new THREE.BoxGeometry(width + 0.7, 0.05, dist);
      e.rotateY(angle); e.translate(mid.x, 0.03, mid.z);
      edgeGeoms.push(e);
    }

    for (const p of pts) {
      const j = new THREE.CylinderGeometry(width / 2, width / 2, 0.08, 12);
      j.translate(p.x, 0.05, p.z);
      surfGeoms.push(j);

      const je = new THREE.CylinderGeometry((width + 0.7) / 2, (width + 0.7) / 2, 0.05, 12);
      je.translate(p.x, 0.03, p.z);
      edgeGeoms.push(je);
    }

    if (name && pts.length >= 2) {
      const midIdx = Math.floor((pts.length - 1) / 2);
      const pos = new THREE.Vector3().addVectors(pts[midIdx], pts[midIdx + 1]).multiplyScalar(0.5);
      const div = document.createElement('div');
      div.className = 'road-label';
      div.textContent = name;
      const obj = new CSS2DObject(div);
      obj.position.set(pos.x, 0.3, pos.z);
      scene.add(obj);
      roadLabels.push(div);
    }
  }

  const mergedSurf = mergeGeometries(surfGeoms, false);
  const surfMesh = new THREE.Mesh(mergedSurf, new THREE.MeshStandardMaterial({ color: CONFIG.colors.roadSurface, roughness: 0.85 }));
  surfMesh.receiveShadow = true;
  scene.add(surfMesh);

  const mergedEdge = mergeGeometries(edgeGeoms, false);
  const edgeMesh = new THREE.Mesh(mergedEdge, new THREE.MeshStandardMaterial({ color: CONFIG.colors.roadEdge, roughness: 0.9 }));
  edgeMesh.receiveShadow = true;
  scene.add(edgeMesh);
}

function findNearestRoadNode(pos) {
  let best = null, minD = Infinity;
  for (const n of roadNodes.values()) {
    const d = n.pos.distanceTo(pos);
    if (d < minD) { minD = d; best = n; }
  }
  return best;
}

function findPath(start, end) {
  const sNode = findNearestRoadNode(start);
  const eNode = findNearestRoadNode(end);
  if (!sNode || !eNode) return [end.clone()];
  if (sNode.id === eNode.id) return [sNode.pos.clone(), end.clone()];

  const open = new Set([sNode.id]);
  const cameFrom = new Map();
  const g = new Map(), f = new Map();
  for (const id of roadNodes.keys()) { g.set(id, Infinity); f.set(id, Infinity); }
  g.set(sNode.id, 0);
  f.set(sNode.id, sNode.pos.distanceTo(eNode.pos));

  while (open.size > 0) {
    let curr = '', bestF = Infinity;
    for (const id of open) {
      const fv = f.get(id) ?? Infinity;
      if (fv < bestF) { bestF = fv; curr = id; }
    }
    if (curr === eNode.id) {
      const path = [end.clone()];
      let k = curr;
      while (k) {
        const node = roadNodes.get(k);
        if (node) path.unshift(node.pos.clone());
        k = cameFrom.get(k);
      }
      return path;
    }
    open.delete(curr);
    const curNode = roadNodes.get(curr);
    for (const nb of curNode.neighbors) {
      const tg = (g.get(curr) ?? Infinity) + nb.cost;
      if (tg < (g.get(nb.id) ?? Infinity)) {
        cameFrom.set(nb.id, curr);
        g.set(nb.id, tg);
        const nbNode = roadNodes.get(nb.id);
        f.set(nb.id, tg + nbNode.pos.distanceTo(eNode.pos));
        open.add(nb.id);
      }
    }
  }
  return [end.clone()];
}

function isClearSpot(x, z) {
  // Tránh sông Hương, đồng lúa lớn phía Đông Nam, và trung tâm địa danh
  if (x + z < -130 && x < -40) return false;
  if (x > 35 && z > 35) return false;
  for (const lm of DATA.landmarks) {
    const p = toMeters(lm.lng, lm.lat);
    if (Math.hypot(x - p.x, z - p.z) < 28) return false;
  }
  return true;
}

function buildHousesAndTrees() {
  // Tạo các cụm nhà dân 1-2 tầng quanh khu vực làng (xóm 8, xóm 9, trục Liên thôn, đường làng)
  const houseSpecs = [];
  for (let i = 0; i < 155; i++) {
    const angle = (i * 2.39996) % (Math.PI * 2);
    const radius = 22 + ((i * 19) % 210);
    const x = Math.cos(angle) * radius - 35;
    const z = Math.sin(angle) * radius - 35;
    if (!isClearSpot(x, z)) continue;

    const floors = (i % 4 === 0) ? 2 : 1;
    const w = 8 + (i % 5) * 1.8;
    const d = 7 + ((i * 3) % 4) * 1.6;
    const h = floors * 3.4;
    const rotY = ((i * 0.7) % 6.28);
    const r = (i * 37) % 100;
    const roofType = r < 60 ? 'red' : (r < 85 ? 'gray' : 'beige');
    houseSpecs.push({ x, z, w, d, h, rotY, roofType });
  }

  // InstancedMesh cho thân nhà
  const wallGeo = new THREE.BoxGeometry(1, 1, 1);
  wallGeo.translate(0, 0.5, 0);
  const wallMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.wallCream, roughness: 0.85 });
  const wallInst = new THREE.InstancedMesh(wallGeo, wallMat, houseSpecs.length);
  wallInst.castShadow = true;
  wallInst.receiveShadow = true;

  // Mái dốc (Cone 4 cạnh xoay 45 độ làm mái tứ diện/nhà dốc low-poly)
  const roofGeo = new THREE.ConeGeometry(0.78, 0.45, 4);
  roofGeo.rotateY(Math.PI / 4);
  const redHouses = houseSpecs.filter(s => s.roofType === 'red');
  const grayHouses = houseSpecs.filter(s => s.roofType === 'gray');
  const beigeHouses = houseSpecs.filter(s => s.roofType === 'beige');

  const makeRoofInst = (list, color) => {
    const inst = new THREE.InstancedMesh(roofGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.72 }), Math.max(1, list.length));
    inst.castShadow = true;
    const dummy = new THREE.Object3D();
    list.forEach((s, idx) => {
      dummy.position.set(s.x, s.h, s.z);
      dummy.rotation.set(0, s.rotY, 0);
      dummy.scale.set(s.w * 1.05, s.h * 0.65, s.d * 1.05);
      dummy.updateMatrix();
      inst.setMatrixAt(idx, dummy.matrix);
    });
    return inst;
  };

  const dummy = new THREE.Object3D();
  houseSpecs.forEach((s, idx) => {
    dummy.position.set(s.x, 0, s.z);
    dummy.rotation.set(0, s.rotY, 0);
    dummy.scale.set(s.w, s.h, s.d);
    dummy.updateMatrix();
    wallInst.setMatrixAt(idx, dummy.matrix);
  });

  scene.add(wallInst);
  scene.add(makeRoofInst(redHouses, CONFIG.colors.roofRed));
  scene.add(makeRoofInst(grayHouses, CONFIG.colors.roofGray));
  scene.add(makeRoofInst(beigeHouses, CONFIG.colors.roofBeige));

  // Cây xanh low-poly InstancedMesh (mật độ cao ven sông & vườn nhà)
  const treePositions = [];
  for (let i = 0; i < 240; i++) {
    let x, z;
    if (i < 85) {
      // Dọc bờ sông Hương
      const t = i / 85;
      x = -290 + t * 230 + ((i % 5) - 2) * 5;
      z = 40 - t * 380 + (((i * 7) % 5) - 2) * 5;
    } else {
      const a = (i * 1.61803) % (Math.PI * 2);
      const rad = 18 + ((i * 23) % 230);
      x = Math.cos(a) * rad - 30;
      z = Math.sin(a) * rad - 30;
      if (x > 40 && z > 40) continue;
    }
    treePositions.push({ x, z, s: 0.75 + (i % 6) * 0.16, dark: i % 2 === 0 });
  }

  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 2.2, 5);
  trunkGeo.translate(0, 1.1, 0);
  const trunkInst = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: CONFIG.colors.woodBrown }), treePositions.length);
  trunkInst.castShadow = true;

  const crownGeo = new THREE.DodecahedronGeometry(2.4, 0);
  crownGeo.scale(1, 1.25, 1);
  crownGeo.translate(0, 3.2, 0);

  const darkTrees = treePositions.filter(t => t.dark);
  const midTrees = treePositions.filter(t => !t.dark);

  const makeCrownInst = (arr, col) => {
    const inst = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.85, flatShading: true }), Math.max(1, arr.length));
    inst.castShadow = true;
    arr.forEach((t, idx) => {
      dummy.position.set(t.x, 0, t.z);
      dummy.rotation.set(0, idx * 0.9, 0);
      dummy.scale.setScalar(t.s);
      dummy.updateMatrix();
      inst.setMatrixAt(idx, dummy.matrix);
    });
    return inst;
  };

  treePositions.forEach((t, idx) => {
    dummy.position.set(t.x, 0, t.z);
    dummy.rotation.set(0, idx, 0);
    dummy.scale.setScalar(t.s);
    dummy.updateMatrix();
    trunkInst.setMatrixAt(idx, dummy.matrix);
  });

  scene.add(trunkInst, makeCrownInst(darkTrees, CONFIG.colors.treeDark), makeCrownInst(midTrees, CONFIG.colors.treeMid));

  // Điểm nhấn: Cây đa đầu làng + giếng cổ + cổng làng
  const banyan = new THREE.Group();
  const bTrunk = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.2, 6, 7), new THREE.MeshStandardMaterial({ color: CONFIG.colors.woodBrown }));
  bTrunk.position.y = 3; bTrunk.castShadow = true;
  const bCrown = new THREE.Mesh(new THREE.DodecahedronGeometry(7.5, 1), new THREE.MeshStandardMaterial({ color: CONFIG.colors.treeDark, flatShading: true }));
  bCrown.position.y = 7.5; bCrown.scale.set(1.2, 0.85, 1.2); bCrown.castShadow = true;
  banyan.add(bTrunk, bCrown);
  banyan.position.set(-25, 0, 12);
  scene.add(banyan);

  const well = new THREE.Group();
  const wWall = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.7, 1.3, 8), new THREE.MeshStandardMaterial({ color: 0x9fa39a }));
  wWall.position.y = 0.65;
  const wWater = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.2, 8), new THREE.MeshStandardMaterial({ color: CONFIG.colors.waterShallow }));
  wWater.position.y = 0.9;
  well.add(wWall, wWater);
  well.position.set(-14, 0, 8);
  scene.add(well);

  // Đèn đường/đèn nhà ấm nhấp nháy nhẹ (additive)
  const glowMat = new THREE.MeshBasicMaterial({
    color: CONFIG.colors.warmLight,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const postMat = new THREE.MeshStandardMaterial({ color: 0x3a3630 });

  for (let i = 0; i < 18; i++) {
    const seg = roadSegments[i % roadSegments.length];
    const p = seg.pts[Math.min(i % seg.pts.length, seg.pts.length - 1)];
    const lx = p.x + ((i % 2 === 0 ? 1 : -1) * 5.2);
    const lz = p.z + (((i * 3) % 2 === 0 ? 1 : -1) * 4.2);

    const lampGroup = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 4.5, 6), postMat);
    pole.position.y = 2.25;
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.65, 8, 8), glowMat);
    bulb.position.y = 4.7;
    lampGroup.add(pole, bulb);
    lampGroup.position.set(lx, 0, lz);
    scene.add(lampGroup);
    lampLights.push({ group: lampGroup, bulb, phase: i * 0.9 });
  }
}

let flyAnim = null;

function flyToPosition(x, z, landmarkId = null, onArrive = null) {
  const targetPos = new THREE.Vector3(x, 0, z);
  const desiredCamPos = new THREE.Vector3(x + 42, 56, z + 58);
  flyAnim = {
    startCam: camera.position.clone(),
    endCam: desiredCamPos,
    startTarget: controls.target.clone(),
    endTarget: targetPos,
    t: 0,
    onArrive
  };

  // Nếu bấm gần bến sông Hương thì hiện nút pill "Lên đò"
  const pierPos = toMeters(DATA.landmarks[3].lng, DATA.landmarks[3].lat);
  const boatPill = document.getElementById('boat-pill');
  if (landmarkId === 'pier' || Math.hypot(x - pierPos.x, z - pierPos.z) < 55) {
    boatPill.classList.add('visible');
  } else {
    boatPill.classList.remove('visible');
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownPos = { x: 0, y: 0 };

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
  if (moved > 6) return; // Bỏ qua nếu đang kéo orbit

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(plane, hit)) {
    isBoating = false;
    currentPath = findPath(playerGroup.position, hit);
    const pierPos = toMeters(DATA.landmarks[3].lng, DATA.landmarks[3].lat);
    document.getElementById('boat-pill').classList.toggle('visible', hit.distanceTo(pierPos) < 55);
  }
});

document.getElementById('boat-pill').addEventListener('click', () => {
  isBoating = true;
  boatProgress = 0;
  currentPath = [];
  playerGroup.position.copy(boatRoute[0]);
});

const modalBackdrop = document.getElementById('modal-backdrop');
const modalCard = document.getElementById('modal-card');

function openQuizModal(id) {
  const q = DATA.quiz[id];
  if (!q) return;

  modalCard.innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-tag">${q.tag}</div>
        <h2 class="modal-title">${q.title}</h2>
      </div>
      <button class="btn-close" id="btn-close-modal">✕</button>
    </div>
    <p class="modal-story">${q.story}</p>
    <div class="quiz-q">${q.question}</div>
    <div class="quiz-options" id="quiz-options">
      ${q.options.map((opt, idx) => `<button class="quiz-opt" data-idx="${idx}">${opt}</button>`).join('')}
    </div>
    <div id="minigame-area"></div>
    <div class="reward-card ${unlockedCards.has(id) ? 'unlocked' : ''}" id="reward-card">
      <strong>🎉 ${q.cardTitle}</strong>
      <p style="font-size:0.85rem;margin-top:4px;">${q.cardDesc}</p>
    </div>
  `;

  modalBackdrop.classList.add('open');
  document.getElementById('btn-close-modal').addEventListener('click', () => modalBackdrop.classList.remove('open'));

  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
      if (idx === q.answer) {
        btn.classList.add('correct');
        if (q.minigame === 'print') {
          setupPrintMinigame(id);
        } else if (q.minigame === 'wrestle') {
          setupWrestleMinigame(id);
        } else {
          markSolved(id);
          document.getElementById('reward-card').classList.add('unlocked');
        }
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.quiz-opt')[q.answer].classList.add('correct');
        document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = false);
      }
    });
  });
}

function setupPrintMinigame(id) {
  const area = document.getElementById('minigame-area');
  area.innerHTML = `
    <div class="minigame-box">
      <div class="minigame-title">🖌️ Mini-game: Kéo con lăn lên ván khắc để in tranh Sình</div>
      <div class="print-canvas-wrap">
        <canvas id="print-canvas" width="460" height="170"></canvas>
      </div>
      <div style="font-size:0.8rem;margin-top:6px;" id="print-status">Tiến độ lăn mực: 0%</div>
    </div>
  `;
  const canvas = document.getElementById('print-canvas');
  const ctx = canvas.getContext('2d');
  // Vẽ nét ván khắc sẵn
  ctx.strokeStyle = '#6b4423';
  ctx.lineWidth = 3;
  ctx.strokeRect(24, 18, canvas.width - 48, canvas.height - 36);
  ctx.font = 'bold 22px Nunito, sans-serif';
  ctx.fillStyle = '#b59469';
  ctx.fillText('TRANH DÂN GIAN LÀNG SÌNH', 88, 92);

  let painted = 0;
  let dragging = false;
  const paintAt = (clientX, clientY) => {
    const r = canvas.getBoundingClientRect();
    const x = (clientX - r.left) * (canvas.width / r.width);
    const y = (clientY - r.top) * (canvas.height / r.height);
    ctx.fillStyle = 'rgba(200, 90, 50, 0.35)';
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fill();
    painted = Math.min(100, painted + 3.5);
    document.getElementById('print-status').textContent = `Tiến độ lăn mực: ${Math.round(painted)}%`;
    if (painted >= 100) {
      markSolved(id);
      document.getElementById('reward-card').classList.add('unlocked');
    }
  };

  canvas.addEventListener('pointerdown', (e) => { dragging = true; paintAt(e.clientX, e.clientY); });
  window.addEventListener('pointermove', (e) => { if (dragging) paintAt(e.clientX, e.clientY); });
  window.addEventListener('pointerup', () => { dragging = false; });
}

function setupWrestleMinigame(id) {
  const area = document.getElementById('minigame-area');
  area.innerHTML = `
    <div class="minigame-box">
      <div class="minigame-title">🤼 Mini-game: Bấm nhịp khi vạch đỏ vào vùng xanh để thắng đô vật (3/3)</div>
      <div class="wrestle-track">
        <div class="wrestle-zone"></div>
        <div class="wrestle-marker" id="wrestle-marker"></div>
      </div>
      <button class="btn-hud" id="btn-wrestle-hit">💥 RA ĐÒN!</button>
      <span style="font-size:0.82rem;margin-left:8px;font-weight:700;" id="wrestle-score">Điểm: 0/3</span>
    </div>
  `;
  let score = 0;
  let pos = 0, dir = 1.6;
  const marker = document.getElementById('wrestle-marker');
  const timer = setInterval(() => {
    if (!document.getElementById('wrestle-marker')) { clearInterval(timer); return; }
    pos += dir;
    if (pos >= 94 || pos <= 0) dir *= -1;
    marker.style.left = pos + '%';
  }, 16);

  document.getElementById('btn-wrestle-hit').addEventListener('click', () => {
    if (pos >= 36 && pos <= 60) {
      score++;
      document.getElementById('wrestle-score').textContent = `Điểm: ${score}/3`;
      if (score >= 3) {
        clearInterval(timer);
        markSolved(id);
        document.getElementById('reward-card').classList.add('unlocked');
      }
    } else {
      score = Math.max(0, score - 1);
      document.getElementById('wrestle-score').textContent = `Trượt nhịp! Điểm: ${score}/3`;
    }
  });
}

// Mini-map
const mmCanvas = document.getElementById('minimap-canvas');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap() {
  mmCtx.clearRect(0, 0, 124, 124);
  mmCtx.fillStyle = '#7a8f4b';
  mmCtx.fillRect(0, 0, 124, 124);

  // Sông góc trên trái
  mmCtx.fillStyle = '#2f6f8f';
  mmCtx.beginPath();
  mmCtx.moveTo(0, 0); mmCtx.lineTo(75, 0); mmCtx.lineTo(25, 78); mmCtx.lineTo(0, 95);
  mmCtx.closePath(); mmCtx.fill();

  // Đồng lúa góc dưới phải
  mmCtx.fillStyle = '#c9b873';
  mmCtx.fillRect(62, 62, 62, 62);

  // Vị trí người chơi
  const px = 62 + (playerGroup.position.x / CONFIG.worldSize) * 124;
  const pz = 62 + (playerGroup.position.z / CONFIG.worldSize) * 124;
  mmCtx.fillStyle = '#d93829';
  mmCtx.beginPath(); mmCtx.arc(px, pz, 4, 0, Math.PI * 2); mmCtx.fill();
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  riceUniforms.uTime.value = elapsed;
  waterUniforms.uTime.value = elapsed;

  fishCages.forEach((c, i) => {
    c.position.y = -0.2 + Math.sin(elapsed * 1.8 + i * 1.4) * 0.12;
  });

  // Đèn nhấp nháy nhẹ
  lampLights.forEach(l => {
    const flicker = 0.72 + Math.sin(elapsed * 6.5 + l.phase) * 0.14;
    l.bulb.material.opacity = isNight ? Math.min(1, flicker + 0.2) : flicker * 0.65;
  });

  // Camera fly-to
  if (flyAnim) {
    flyAnim.t = Math.min(1, flyAnim.t + dt * 1.4);
    const ease = 1 - Math.pow(1 - flyAnim.t, 3);
    camera.position.lerpVectors(flyAnim.startCam, flyAnim.endCam, ease);
    controls.target.lerpVectors(flyAnim.startTarget, flyAnim.endTarget, ease);
    if (flyAnim.t >= 1) {
      const cb = flyAnim.onArrive;
      flyAnim = null;
      if (cb) cb();
    }
  }

  // Di chuyển trên sông ("Lên đò") hoặc đi bộ theo đường làng
  if (isBoating) {
    boatProgress = Math.min(boatRoute.length - 1.001, boatProgress + dt * 0.35);
    const idx = Math.floor(boatProgress);
    const frac = boatProgress - idx;
    playerGroup.position.lerpVectors(boatRoute[idx], boatRoute[idx + 1], frac);
    playerGroup.position.y = 0.25 + Math.sin(elapsed * 3) * 0.08;
    if (boatProgress >= boatRoute.length - 1.01) isBoating = false;
  } else if (currentPath.length > 0) {
    const nextPt = currentPath[0];
    const dir = new THREE.Vector3().subVectors(nextPt, playerGroup.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist < 1.2) {
      currentPath.shift();
    } else {
      dir.normalize();
      playerGroup.position.addScaledVector(dir, 18 * dt);
      playerGroup.rotation.y = Math.atan2(dir.x, dir.z);
    }
  }

  // NPC chuyển động nhẹ
  npcs.forEach(n => {
    n.mesh.position.x = n.origin.x + Math.sin(elapsed * 0.7 + n.phase) * 10;
    n.mesh.position.z = n.origin.z + Math.cos(elapsed * 0.6 + n.phase) * 8;
  });

  // LOD nhãn theo khoảng cách camera
  const camDist = camera.position.distanceTo(controls.target);
  const farZoom = camDist > 330;
  landmarkLabelEls.forEach(el => el.classList.toggle('lod-hidden', camDist > 460));
  roadLabels.forEach(el => el.classList.toggle('lod-hidden', farZoom));

  controls.update();
  drawMinimap();
  composer.render();
  labelRenderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

init().catch(showMapError);
animate();
} catch (error) {
  showMapError(error);
}
